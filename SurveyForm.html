<!DOCTYPE html>
<html>
<head>
    <title>Survey Form</title>
    <link rel="stylesheet" href="SF.css">
</head>
<body>

<div class="container">
    <h1>Survey Form</h1>
    <p>Please fill out the form below.</p>

    <form>
        <label>Name:</label>
        <input type="text" placeholder="Enter your name">

        <label>Email:</label>
        <input type="email" placeholder="Enter your email">

        <label>Age:</label>
        <input type="number" placeholder="Enter your age">

        <label>Gender:</label>
        <select>
            <option>Select Gender</option>
            <option>Male</option>
            <option>Female</option>
            <option>Other</option>
        </select>

        <label>How did you find us?</label>
        <select>
            <option>Select an option</option>
            <option>Google</option>
            <option>Friend</option>
            <option>Social Media</option>
        </select>

        <label>Rate our website:</label>

        <div class="radio">
            <input type="radio" name="rating"> Excellent
            <input type="radio" name="rating"> Good
            <input type="radio" name="rating"> Average
        </div>

        <label>Comments:</label>
        <textarea placeholder="Write your comments"></textarea>

        <button type="submit">Submit</button>
    </form>
</div>
</body>
</html>
